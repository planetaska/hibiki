# Standalone (not inherit_from ../.rubocop.yml): the root config excludes
# hibiki_phlex/**/*, and inherited Exclude paths resolve relative to the
# defining file — inheriting would exclude every file here. Standalone is
# also what the gem needs at extraction time. Keep style in sync with root.
AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Spec blocks are naturally long, and specs define fixture components whose
# view_template methods read like real apps — don't squeeze those.
Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - "*.gemspec"
